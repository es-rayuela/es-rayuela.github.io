<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rayuela · Sentido para tu español</title>
<meta name="description" content="Percorra esta Rayuela e descubra o que falta para o espanhol entrar de verdade na sua vida." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
 --laranja:#f2ad5e; --rosa:#ed4c87; --azul:#6ca7b7;
 --escuro:#242736; --branco:#ffffff;
 --papel:#fbf7f1; --papel2:#f0e7da;
 --sombra:0 10px 30px rgba(36,39,54,.08);
 --sombra-forte:0 16px 44px rgba(36,39,54,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Nunito",system-ui,sans-serif;color:var(--escuro);background:
  radial-gradient(1200px 500px at 100% 0%, rgba(237,76,135,.08), transparent 60%),
  var(--papel);
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100dvh}

h1,h2,h3,.titulo{font-family:"Barriecito",cursive;font-weight:400;letter-spacing:.3px;color:var(--escuro);line-height:1.14;margin:0}
p{margin:0 0 14px}.lead{font-size:17px;color:#3d3f52}.muted{color:#6b6d7e;font-size:14px}
.kicker{display:block;font:800 12px/1 "Nunito";letter-spacing:2px;text-transform:uppercase;color:var(--rosa);margin-bottom:12px}
.center{text-align:center}.spacer{flex:1}

.page{max-width:1180px;margin:0 auto;padding:22px 22px 70px}
@media(min-width:1360px){ .page{zoom:1.1} }
@media(min-width:1680px){ .page{zoom:1.2} }
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand-mark{height:92px;width:auto;display:block}
.brand-txt b{font-family:"Barriecito",cursive;font-weight:400;font-size:26px;color:var(--escuro);display:block;line-height:1}
.brand-txt small{display:block;font-weight:800;font-size:12.5px;letter-spacing:2.5px;color:var(--azul);text-transform:uppercase}
.btn.link{background:none;color:var(--azul);padding:8px 4px;font:800 15px "Nunito";border:none;cursor:pointer}

/* SHELL (perguntas) */
.shell{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
.side{position:sticky;top:22px}
.panel{background:#fff;border-radius:26px;box-shadow:var(--sombra);padding:22px 20px}
.panel h3{font-size:24px;margin-bottom:14px}
.step{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:16px;margin-bottom:2px;transition:.2s}
.step.now{background:rgba(242,173,94,.20)}
.step .num{flex:0 0 40px;height:40px;border-radius:13px;border:2px solid rgba(108,167,183,.35);display:grid;place-items:center;font-family:"Barriecito",cursive;font-size:20px;color:#9aa0ad;background:#fff}
.step.now .num{border-color:var(--rosa);color:var(--rosa)}
.step.done .num{background:var(--laranja);border-color:var(--laranja);color:#fff}
.step .lbl{font-weight:700;color:#9aa0ad;font-size:15px}
.step.now .lbl,.step.done .lbl{color:var(--escuro)}
.sep{height:1px;background:var(--papel2);margin:16px 2px}
.mchips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-weight:800;font-size:13px;background:var(--papel);color:#b3aa9c;border:1.5px dashed #d9cdbd}
.chip.on{background:rgba(237,76,135,.12);color:var(--rosa);border:1.5px solid rgba(237,76,135,.3)}

/* CARD principal da pergunta */
.main{background:#fff;border-radius:28px;box-shadow:var(--sombra);padding:34px 32px;position:relative;overflow:hidden}
.main::after{content:"";position:absolute;top:-70px;right:-70px;width:230px;height:230px;border-radius:50%;background:rgba(237,76,135,.10)}
.main>*{position:relative;z-index:1}
.qtitle{font-family:"Barriecito",cursive;font-size:clamp(30px,4.6vw,46px);line-height:1.08;margin:4px 0 10px}
.qsub{color:#6b6d7e;font-size:16px;margin-bottom:18px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;border:2px solid var(--papel2);border-radius:18px;padding:16px 18px;font:700 15px/1.35 "Nunito";color:var(--escuro);cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--azul);transform:translateY(-1px)}
.opt:focus-visible{outline:3px solid rgba(108,167,183,.5);outline-offset:2px}
.opt .mark{flex:0 0 24px;height:24px;border-radius:8px;border:2px solid #cdbfad;display:grid;place-items:center;transition:.15s}
.opt.round .mark{border-radius:50%}
.opt[aria-checked="true"]{border-color:var(--rosa);background:rgba(237,76,135,.06)}
.opt[aria-checked="true"] .mark{background:var(--rosa);border-color:var(--rosa)}
.opt[aria-checked="true"] .mark::after{content:"✓";color:#fff;font-size:14px;font-weight:800}
.outros-wrap{margin:-4px 0 4px}
.outros-in{width:100%;font:600 15px "Nunito";padding:12px 14px;border-radius:14px;border:2px solid var(--papel2);background:#fff}
.outros-in:focus{outline:none;border-color:var(--azul)}

.field label{display:block;font-weight:800;margin:0 0 6px}
.field input{width:100%;font:600 17px "Nunito";padding:14px 16px;border-radius:14px;border:2px solid var(--papel2);background:#fff}
.field input:focus{outline:none;border-color:var(--azul)}
.blocktitle{font-weight:800;margin:22px 0 8px;font-size:16px}

.btns{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.btn{font:800 16px "Nunito";border:none;border-radius:16px;padding:15px 22px;cursor:pointer;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:focus-visible{outline:3px solid rgba(36,39,54,.4);outline-offset:2px}
.btn.primary{background:var(--rosa);color:#fff;box-shadow:0 8px 20px rgba(237,76,135,.26)}
.btn.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.cta{background:linear-gradient(135deg,var(--rosa),var(--laranja));color:#fff;box-shadow:0 10px 24px rgba(237,76,135,.28);width:100%;font-size:17px;padding:16px 22px}
.btn.cta:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--escuro);border:2px solid var(--papel2)}
.btn.ghost:hover{border-color:var(--azul)}
.btn.sm{padding:11px 16px;font-size:14px}
.btn.block{width:100%}
.err{color:var(--rosa);font-weight:700;font-size:14px;margin-top:10px;min-height:1px}

/* barra de progresso mobile */
.mbar{display:none}
@media(max-width:900px){ .opts{grid-template-columns:1fr} }
@media(max-width:760px){
 .shell{grid-template-columns:1fr}
 .side{display:none}
 .main{padding:24px 20px;border-radius:24px}
 .mbar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
 .mbar .mh{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:"Barriecito",cursive;font-size:16px;background:rgba(108,167,183,.12);border:2px solid rgba(108,167,183,.3);color:#9aa0ad}
 .mbar .mh.done{background:var(--laranja);border-color:var(--laranja);color:#fff}
 .mbar .mh.now{background:#fff;border-color:var(--rosa);color:var(--rosa)}
 .mbar .mmoch{margin-left:auto;font-size:17px}
 .brand-mark{height:60px}
 .page{padding:18px 16px 64px}
}

/* Conteúdo centrado (intro/transição/resultado) */
.narrow{max-width:680px;margin:0 auto}
.rescol{min-width:0}
.card{background:#fff;border-radius:26px;box-shadow:var(--sombra);padding:26px 24px;margin-bottom:18px;position:relative;overflow:hidden}
.card.hero{background:linear-gradient(160deg,#fff,rgba(242,173,94,.10))}
.card.rec{background:linear-gradient(160deg,rgba(237,76,135,.09),rgba(242,173,94,.14));border:1px solid rgba(237,76,135,.22)}
.chip-tag{display:inline-block;background:rgba(108,167,183,.16);color:var(--azul);font-weight:800;font-size:12px;letter-spacing:1px;padding:7px 14px;border-radius:999px;margin-bottom:14px}
.res-hero::after{content:"";position:absolute;top:-70px;right:-70px;width:240px;height:240px;border-radius:50%;background:rgba(237,76,135,.10)}
.res-title{font-size:clamp(26px,5vw,38px);line-height:1.08;margin-bottom:16px}
.rec-inner{background:linear-gradient(160deg,rgba(237,76,135,.08),rgba(242,173,94,.13));border:1px solid rgba(237,76,135,.2);border-radius:20px;padding:20px;margin:18px 0}
.frase-marca{font-style:italic;color:#6b6d7e;margin:18px 0 16px}
.res-note{color:#9a9ab0;font-size:13px;margin:0}
.cta-row .res-note{flex-basis:100%;order:3}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.cta-row .btn{width:auto}
.cta-row .cta-main{flex:1 1 260px}
.cta-row .ghost-light{flex:1 1 200px}
.btn.ghost-light{background:#fff;color:var(--escuro);border:2px solid var(--papel2)}
.btn.ghost-light:hover{border-color:var(--azul);transform:translateY(-1px)}
@media(max-width:600px){.cta-row{flex-direction:column}.cta-row .btn{width:100%;flex:none}.cta-row .res-note{order:1;margin:2px 0}.cta-row .ghost-light{order:2}}
/* tela inicial */
.intro-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:stretch;padding:10px 0}
.intro-text{display:flex;flex-direction:column;justify-content:space-between}
.it-top p{font-size:18.5px;line-height:1.6}
.it-top .lead{font-size:20px;line-height:1.55}
.intro-title{font-size:clamp(32px,4.8vw,52px);line-height:1.08;margin:12px 0 16px}
.intro-title .ac{color:var(--rosa)}
.intro-kicker{display:block;font:800 12px/1 "Nunito";letter-spacing:2px;text-transform:uppercase;color:var(--rosa);margin-bottom:8px}
#serieW,#serieT,#serieO{transition:opacity .35s ease}
.mochila-note{font-size:14.5px;color:#3d3f52;background:rgba(242,173,94,.15);border-radius:14px;padding:11px 15px;margin:12px 0 2px}
.muted-2{color:#6b6d7e}
.btn.dark-btn{background:var(--escuro);color:#fff;box-shadow:0 10px 24px rgba(36,39,54,.22);font-size:17px}
.btn.dark-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.intro-side{display:flex;flex-direction:column;justify-content:flex-start;gap:16px;padding:10px 0}
.serie-titulo{font-weight:800;color:var(--escuro);font-size:15px;line-height:1.4;margin:0 0 14px}
.onde{font-size:14px;color:#3d3f52;margin:8px 0 0}
.onde b{color:var(--azul)}
.mochila-side{display:flex;gap:14px;align-items:center;background:rgba(237,76,135,.10);border:1px solid rgba(237,76,135,.18);border-radius:20px;padding:15px 18px}
.mochila-side .ms-bag{font-size:34px;flex:0 0 auto;line-height:1}
.mochila-side .ms-body b{display:block;font-size:15px;margin-bottom:8px}
.mochila-side .ms-desc{font-size:13.5px;color:#3d3f52;line-height:1.45;margin:0 0 10px}
.mochila-intro{background:rgba(108,167,183,.12);border-radius:18px;padding:14px 16px;font-size:14px;color:#3d3f52;line-height:1.5}
.mochila-intro b{color:var(--escuro);font-size:15px}
.wa-float{position:fixed;right:16px;bottom:16px;z-index:45;display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--rosa),var(--laranja));color:#fff;font:800 14px "Nunito";text-decoration:none;padding:12px 18px;border-radius:999px;box-shadow:0 10px 26px rgba(237,76,135,.35)}
.wa-float:hover{filter:brightness(1.05);transform:translateY(-1px)}
.wa-float .wa-ic{display:inline-flex;align-items:center;line-height:1}
.wa-float .wa-ic svg{width:22px;height:22px;display:block}
@media(max-width:600px){ .wa-float{right:12px;bottom:12px;padding:13px} .wa-float .wa-tx{display:none} }
.mochila-side .ms-chip{display:inline-block;background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;color:var(--rosa);box-shadow:var(--sombra)}
.ms-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ms-chip.ghost{background:transparent;color:#b3aa9c;border:1.5px dashed #d9cdbd;box-shadow:none}
.guardar-btn{margin-top:16px;width:100%;background:var(--rosa);color:#fff;font-size:15px;padding:13px 18px;box-shadow:0 8px 18px rgba(237,76,135,.25)}
.guardar-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.guardar-btn.saved{background:rgba(108,167,183,.18);color:var(--escuro);box-shadow:none;cursor:default;transform:none}
.confetti{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:70;animation:conf .95s ease-out forwards}
@keyframes conf{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.mochila-side.pop{animation:mpop .5s ease}
@keyframes mpop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
.palabra-card{position:relative;background:#fff;border-radius:26px;box-shadow:var(--sombra-forte);padding:28px 26px;overflow:hidden}
.palabra-card::after{content:"";position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:rgba(242,173,94,.16)}
.palabra-card>*{position:relative;z-index:1}
.palabra-card .pk{display:block;font:800 11px/1 "Nunito";letter-spacing:2px;text-transform:uppercase;color:var(--azul);margin-bottom:10px}
.palabra-card .serie{font-family:"Barriecito",cursive;font-size:clamp(28px,3.2vw,38px);color:var(--rosa);line-height:1.06;margin-bottom:12px}
.palabra-card p{font-size:15px;color:#3d3f52;margin:0 0 10px}
.palabra-card .pk2{font-weight:800;color:var(--escuro);margin:0}
@media(max-width:820px){.intro-grid{grid-template-columns:1fr}.intro-side{margin-top:8px}}
.card h1{font-size:clamp(30px,8vw,46px)}
.card h2{font-size:clamp(23px,6vw,32px)}
.card h3{font-size:22px}
.box{border-radius:18px;padding:16px 18px;margin:14px 0}
.box.laranja{background:rgba(242,173,94,.16)}.box.rosa{background:rgba(237,76,135,.12)}
.box.azul{background:rgba(108,167,183,.16)}.box.escuro{background:var(--escuro);color:#fff}.box.escuro *{color:#fff}

.acc{border:2px solid var(--papel2);border-radius:16px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px;font-weight:800}
.acc summary::-webkit-details-marker{display:none}
.acc summary .chev{margin-left:auto;transition:.2s;color:var(--azul)}
.acc[open] summary .chev{transform:rotate(180deg)}
.acc .body{padding:0 18px 18px;font-size:15px;color:#3d3f52}
.acc .body ul{margin:8px 0 0;padding-left:18px}.acc .body li{margin:4px 0}
.acc .resume{font-weight:600;color:#6b6d7e;font-size:13.5px}


.transicao{display:grid;place-items:center;min-height:66dvh;text-align:center;padding:20px}
.transicao .frase{font-family:"Barriecito",cursive;font-size:clamp(24px,6.5vw,34px);color:var(--escuro);max-width:520px;transition:opacity .5s ease;min-height:120px;display:grid;align-items:center}
.dots{margin-top:18px}.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rosa);margin:0 4px;animation:bounce 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--laranja)}.dots span:nth-child(3){animation-delay:.3s;background:var(--azul)}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}

.cookie{position:fixed;z-index:50;left:12px;right:12px;bottom:12px;max-width:620px;margin:0 auto;background:var(--escuro);color:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--sombra-forte);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cookie p{margin:0;font-size:13.5px;flex:1 1 260px;color:#e9e9ee}.cookie a{color:var(--laranja);font-weight:800}
.cookie .cbtns{display:flex;gap:8px}.cookie .btn{padding:10px 16px;font-size:14px}

.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pri{display:flex;gap:12px;align-items:flex-start;margin:10px 0}.pri .n{font-family:"Barriecito";font-size:24px;color:var(--rosa);line-height:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function toggleOpt(btn){
 const q=btn.dataset.q,o=btn.dataset.o,tipo=btn.dataset.tipo,max=+btn.dataset.max; clearErr();
 if(tipo==='single'){state.answers[q]=o;
  document.querySelectorAll('.opt[data-q="'+q+'"]').forEach(b=>b.setAttribute('aria-checked',b.dataset.o===o));
 } else {let arr=[...(state.answers[q]||[])];
  if(arr.includes(o)) arr=arr.filter(x=>x!==o);
  else{ if(arr.length>=max){showErr('Você pode escolher até '+max+'.');return;} arr.push(o); }
  state.answers[q]=arr;
  document.querySelectorAll('.opt[data-q="'+q+'"]').forEach(b=>b.setAttribute('aria-checked',arr.includes(b.dataset.o)));}
 const wrap=document.getElementById('ow_'+q);
 if(wrap){const checked=tipo==='single'?state.answers[q]==='outros':state.answers[q].includes('outros');

 save();
}

 track('EtapaConcluida',{etapa:p.casa});

 goto(nextOf(qid));
}

 if(!state.name){showErr('Conte só seu primeiro nome para personalizar o seu resultado.');document.getElementById('nome')?.focus();return;}
 if(!state.gifts.includes('series')) state.gifts.push('series');
 track('EtapaConcluida',{etapa:5}); goto('transicao');
}

function optLabel(q,id){ if(id==='outros')return (state.outros[q]&&state.outros[q].trim())?state.outros[q].trim():"Outro";
 const p=(q==='q5exp'||q==='q5ritmo')?PERGUNTAS[4]:byId(q); const src=q==='q5exp'?p.exp:q==='q5ritmo'?p.ritmo:p.opcoes;
 const o=src.find(x=>x.id===id); return o?o.label:id; }
function labelsJoin(q,arr){return (arr||[]).map(id=>optLabel(q,id)).join(", ");}
function joinNat(a){if(!a.length)return"";if(a.length===1)return a[0];if(a.length===2)return a[0]+" e "+a[1];return a.slice(0,-1).join(", ")+" e "+a[a.length-1];}

function calcularRecomendacao(){
 const {q1,q2,q3,q4,q5exp,q5ritmo}=state.answers;
 const s={individual:0,grupo:0,projeto:0,autodidatas:0,clubes:0,bianka:0};
 if(q5exp.includes('individual'))s.individual+=3;
 if(q5exp.includes('estruturado')){s.individual+=1;s.grupo+=1;}
 if(q5exp.includes('trocas'))s.grupo+=3; if(q5exp.includes('autonomia'))s.autodidatas+=3;
 if(q5exp.includes('intenso'))s.projeto+=3; if(q5exp.includes('culturaexp')){s.clubes+=2;s.grupo+=1;}
 if(q5exp.includes('naosei'))s.bianka+=3;
 if(q5ritmo==='uma')s.individual+=2; if(q5ritmo==='duas'){s.individual+=1;s.grupo+=1;}
 if(q5ritmo==='espacado')s.autodidatas+=3; if(q5ritmo==='projeto')s.projeto+=3;
 if(q5ritmo==='clube')s.clubes+=3; if(q5ritmo==='decidir')s.bianka+=3;
 if(q1.includes('trabalho')){s.projeto+=2;s.individual+=1;} if(q1.includes('viagem'))s.projeto+=2; if(q1.includes('cultura'))s.clubes+=2;
 if(q4.includes('trabalho')||q4.includes('especifica'))s.projeto+=2; if(q4.includes('mudanca')||q4.includes('academico'))s.projeto+=1;
 if(q4.includes('cultura'))s.clubes+=1; if(q4.includes('pessoas'))s.grupo+=1;
 if(q2.includes('sozinha'))s.autodidatas+=2;
 if(q3.includes('medo')||q3.includes('palavras')||q3.includes('gaveta'))s.individual+=2; if(q3.includes('oquestudar'))s.individual+=1;
 const ent=Object.entries(s).sort((a,b)=>b[1]-a[1]); const [tk,tv]=ent[0],sv=ent[1][1];
 if(tv<=2||(tv-sv<=0&&tk!=='bianka')||q5exp.includes('naosei')||q5ritmo==='decidir')return 'bianka';
 return tk;
}
function calcularPrioridades(){
 const {q1,q2,q3,q4}=state.answers; const P=[]; const add=t=>{if(P.length<3&&!P.includes(t))P.push(t);};
 if(q2.includes('entendo')||q3.includes('palavras')||q3.includes('medo'))add("Transformar compreensão em comunicação");
 if(q3.includes('gaveta')||q3.includes('oquestudar'))add("Organizar conhecimentos dispersos");
 if(q3.includes('portugues'))add("Reduzir interferências automáticas do português");
 if(q3.includes('medo')||q3.includes('perfec'))add("Construir segurança para falar sem esperar perfeição");
 if(q3.includes('some')||q3.includes('tempo'))add("Criar uma rotina possível e sustentável");
 if(q3.includes('progresso'))add("Aprender a perceber e registrar o próprio progresso");
 if(q4.includes('trabalho')||q4.includes('especifica'))add("Desenvolver espanhol para situações profissionais reais");
 if(q2.includes('zero'))add("Construir uma base sólida desde o início");
 if(q2.includes('precisao')||q1.includes('alem'))add("Ampliar precisão e naturalidade");
 if(q4.includes('cultura'))add("Conectar o idioma à cultura e a conteúdos autênticos");
 if(q1.includes('viagem')||q4.includes('mudanca')||q4.includes('academico'))add("Preparar uma situação ou projeto específico");
 if(q2.includes('sozinha'))add("Desenvolver autonomia com orientação");
 ["Transformar compreensão em comunicação","Criar uma rotina possível e sustentável","Conectar o idioma à cultura e a conteúdos autênticos"].forEach(add);
 return P.slice(0,3);
}

function leituraPersonalizada(){
 const {q1,q2,q3,q4}=state.answers;
 const m=q1[0]==='outros'?(state.outros.q1||"seguir um objetivo bem seu"):(MOTIV[q1[0]]||"seguir seu caminho no espanhol");
 const h=q2[0]==='outros'?"você tem uma história bem particular com o idioma":(HIST[q2[0]]||"você já tem alguma relação com o espanhol");
 const dif=q3.slice(0,2).map(id=>id==='outros'?(state.outros.q3||"um desafio bem seu"):DIF[id]).filter(Boolean);
 const cen=q4.map(id=>id==='outros'?(state.outros.q4||"onde você mais precisa"):CENA[id]).filter(Boolean);
 const p1=`Pelas suas respostas, ${state.name}, parece que você quer ${m}. Hoje, ${h}, e isso já diz bastante sobre o caminho que faria sentido para você.`;
 const p2=dif.length?`No percurso, costumam aparecer coisas como ${joinNat(dif)}. Nada disso significa que seu espanhol está quebrado: muitas vezes o que falta não é acumular mais conteúdo, e sim organizar o que já existe, criar oportunidades reais de uso e construir uma rotina que caiba na sua vida.`:`O que aparece é menos “falta de conteúdo” e mais a necessidade de dar direção e uso ao que você já sabe.`;
 const p3=cen.length?`Você quer que o espanhol apareça principalmente ${joinNat(cen)}. Um caminho possível seria conectar o idioma a essas cenas desde cedo, para que ele deixe de ser matéria de livro e comece a virar linguagem viva.`:`Um caminho possível seria conectar o espanhol a cenas reais da sua vida, para que ele deixe de ser conteúdo e comece a virar linguagem.`;
 return [p1,p2,p3];
}

let audioCtx=null;
function playSaveSound(){ try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const ctx=audioCtx; if(ctx.state==='suspended') ctx.resume(); const now=ctx.currentTime;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(430,now); o.frequency.exponentialRampToValueAtTime(250,now+0.14);
  g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(0.3,now+0.03); g.gain.exponentialRampToValueAtTime(0.0001,now+0.34);
  o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now+0.36);
}catch(e){} }
function confettiBurst(x,y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#ed4c87','#f2ad5e','#6ca7b7'];
  for(let i=0;i<16;i++){ const d=document.createElement('div'); d.className='confetti';
    d.style.left=x+'px'; d.style.top=y+'px'; d.style.background=cols[i%3];
    const a=Math.random()*6.28, dist=40+Math.random()*70;
    d.style.setProperty('--dx',Math.round(Math.cos(a)*dist)+'px');
    d.style.setProperty('--dy',Math.round(Math.sin(a)*dist-50)+'px');
    document.body.appendChild(d); setTimeout(()=>d.remove(),950);
  }
}

  const rr=(px,py,w,h,r)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();};
  const wrapT=(t,maxW,font)=>{x.font=font;const ws=t.split(' ');let ln=[],cur='';ws.forEach(w=>{const test=(cur?cur+' ':'')+w;if(x.measureText(test).width>maxW&&cur){ln.push(cur);cur=w;}else cur=test;});if(cur)ln.push(cur);return ln;};
  x.textBaseline='alphabetic'; x.textAlign='left';
  x.fillStyle=cream; x.fillRect(0,0,W,H);
  const blob=(cx,cy,r,c,a)=>{x.globalAlpha=a;x.fillStyle=c;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.globalAlpha=1;};
  blob(W-150,120,92,rosa,.13); blob(W-84,214,58,laranja,.16); blob(W-206,232,44,azul,.14);
  // header: logo direto no fundo (sem caixa), como no artefato
  if(logo.width){ const lh=94, lw=logo.width*lh/logo.height; x.drawImage(logo, M, 42, lw, lh); }
  const sx=M+100;
  try{ x.letterSpacing='2px'; }catch(e){}
  x.fillStyle=azul; x.font='800 21px "Nunito"'; x.fillText('SENTIDO PARA TU ESPAÑOL', sx, 100);
  const slw=x.measureText('SENTIDO PARA TU ESPAÑOL').width;
  try{ x.letterSpacing='0px'; }catch(e){}
  x.strokeStyle=azul; x.lineWidth=3; x.beginPath(); x.moveTo(sx,114); x.lineTo(sx+slw+2,114); x.stroke();
  // título
  x.font='400 78px "Barriecito"'; x.fillStyle=escuro; x.fillText('Séries em ', M, 254);
  const w1=x.measureText('Séries em ').width; x.fillStyle=rosa; x.fillText('cartaz', M+w1, 254);
  x.fillStyle=body; x.font='400 40px "Nunito"'; x.fillText('para ver em espanhol', M, 302);
  // narrativa
  const nbY=338, nbH=134, nbW=W-2*M;
  x.fillStyle='rgba(242,173,94,.10)'; rr(M,nbY,nbW,nbH,18); x.fill();
  x.fillStyle=laranja; rr(M,nbY,7,nbH,4); x.fill();
  x.fillStyle=body; let ny=nbY+42;
  wrapT('Aprender espanhol também é diversão. Estas séries são um convite para o idioma entrar na sua vida sem esforço: legenda em espanhol, ouvido atento e um bom sofá. Comece por qualquer uma; o importante é apertar o play.', nbW-70, '400 24px "Nunito"').forEach(l=>{x.font='400 24px "Nunito"';x.fillText(l,M+34,ny);ny+=31;});
  // eyebrow
  try{ x.letterSpacing='2px'; }catch(e){}
  x.fillStyle=azul; x.font='800 20px "Nunito"'; x.fillText('ESCOLHA UMA E DÊ O PLAY', M, nbY+nbH+52);
  try{ x.letterSpacing='0px'; }catch(e){}
  // grid
  const gy0=nbY+nbH+82, gap=28, colW=(W-2*M-gap)/2, cardH=196, rowGap=22;
  for(let r=0;r<5;r++) for(let col=0;col<2;col++){
    const i=col===0?r:r+5, s=SERIES[i], ac=accents[i%3];
    const cx=M+col*(colW+gap), cy=gy0+r*(cardH+rowGap);
    x.save(); x.shadowColor='rgba(36,39,54,.10)'; x.shadowBlur=16; x.shadowOffsetY=6; x.fillStyle=ac; rr(cx,cy,colW,cardH,16); x.fill(); x.restore();
    x.fillStyle='#fff'; rr(cx,cy+8,colW,cardH-8,14); x.fill();
    x.fillStyle=ac; x.beginPath(); x.arc(cx+42,cy+48,21,0,7); x.fill();
    x.fillStyle='#fff'; x.font='400 27px "Barriecito"'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(String(i+1),cx+42,cy+50); x.textAlign='left'; x.textBaseline='alphabetic';
    x.fillStyle=escuro; x.font='700 26px "Nunito"'; x.fillText(s.p, cx+76, cy+56);
    const cc=s.c.toUpperCase(); try{x.letterSpacing='1px';}catch(e){} x.font='800 12px "Nunito"'; const pw=x.measureText(cc).width+22;
    x.fillStyle=tint[ac]; rr(cx+colW-pw-20, cy+36, pw, 25, 12); x.fill(); x.fillStyle=ac; x.fillText(cc, cx+colW-pw-20+11, cy+52); try{x.letterSpacing='0px';}catch(e){}
    const desc=s.t.replace(/\s*\([^)]*\)\s*$/,''); x.fillStyle=body; let dy=cy+96;
    wrapT(desc, colW-56, '400 20px "Nunito"').slice(0,3).forEach(l=>{x.font='400 20px "Nunito"';x.fillText(l,cx+28,dy);dy+=25;});
    x.fillStyle=azul; x.font='800 18px "Nunito"'; x.fillText('Onde assistir:', cx+28, cy+cardH-24);
    const ow=x.measureText('Onde assistir:').width; x.fillStyle=escuro; x.font='400 18px "Nunito"'; x.fillText(' '+s.o, cx+28+ow+3, cy+cardH-24);
  }
  // rodapé
  const fy=gy0+5*(cardH+rowGap)+44;
  x.fillStyle=escuro; x.font='400 50px "Barriecito"'; x.fillText('Boa maratona!', M, fy);
  x.strokeStyle=gray; x.lineWidth=2.5; rr(M+2, fy+16, 22, 22, 7); x.stroke(); x.fillStyle=gray; x.beginPath(); x.arc(M+13, fy+27, 5,0,7); x.stroke();
  x.fillStyle=gray; x.font='700 22px "Nunito"'; x.fillText('@es.rayuela', M+34, fy+34);
  [azul,laranja,rosa].forEach((c,k)=>{x.fillStyle=c;x.beginPath();x.arc(W-M-44+k*20, fy+22, 6,0,7);x.fill();});
  // PDF
  const jpeg=cv.toDataURL('image/jpeg',0.9).split(',')[1], jbin=atob(jpeg);
  const A={w:595.28,h:841.89}, content='q '+A.w+' 0 0 '+A.h+' 0 0 cm /Im1 Do Q', objs={};
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  objs[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+A.w+' '+A.h+'] /Resources << /XObject << /Im1 5 0 R >> >> /Contents 4 0 R >>';
  objs[4]='<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
  objs[5]='<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jbin.length+' >>\nstream\n'+jbin+'\nendstream';
  let pdf='%PDF-1.4\n'; const off={};
  for(let n=1;n<=5;n++){ off[n]=pdf.length; pdf+=n+' 0 obj\n'+objs[n]+'\nendobj\n'; }
  const xref=pdf.length; pdf+='xref\n0 6\n0000000000 65535 f \n';
  for(let n=1;n<=5;n++){ pdf+=String(off[n]).padStart(10,'0')+' 00000 n \n'; }
  pdf+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  const bytes=new Uint8Array(pdf.length); for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&0xff;
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  const a=document.createElement('a'); a.href=url; a.download='series-em-espanhol-rayuela.pdf'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000); track('PdfSeriesBaixado');
 }catch(e){ toast('Não consegui gerar o PDF agora.'); }
}
function guardLink(e,url,msg){if(!url||url.startsWith('INSERIR')){e.preventDefault();toast(msg);return false;}return true;}
function toast(t){const d=document.createElement('div');d.className="box escuro";d.textContent=t;
 d.style.cssText="position:fixed;bottom:20px;left:20px;right:20px;z-index:60;max-width:600px;margin:0 auto";document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}

/* ===================== REINÍCIO / BOOT ===================== */
function reiniciar(){state={step:"intro",answers:{q1:[],q2:[],q3:[],q4:[],q5exp:[],q5ritmo:null},outros:{q1:"",q2:"",q3:"",q4:"",q5exp:"",q5ritmo:""},name:"",gifts:[]};try{localStorage.removeItem('rayuela_estado');}catch(e){}render();}
function boot(){
 const pl=document.getElementById('privacyLink'); if(pl)pl.href=CONFIG.privacyUrl;
 let saved=null; try{saved=localStorage.getItem('rayuela_consent');}catch(e){}
 if(saved==="1"){CONSENT=true;initPixel();} else if(saved!=="0"){document.getElementById('cookie').style.display='flex';}
 const s=load(); if(s&&s.step&&s.step!=="intro"&&s.step!=="transicao"){state=s;}
 render();
}
boot();
